# Release workflow (implementation plan 0.3a). `cargo xtask release` pushes a
# `<unit>-vX.Y.Z` tag; this builds the unit and publishes its GitHub Release,
# with that version's changelog section as the notes.
name: Release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.tag.outputs.unit }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          unit="${tag%-v*}"
          version="${tag##*-v}"
          echo "unit=$unit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == 0.0.* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  mvm:
    needs: meta
    if: needs.meta.outputs.unit == 'mvm'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, run: "" }
          - { target: x86_64-apple-darwin, os: macos-latest, run: "arch -x86_64" }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, run: "" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, run: skip }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, run: "" }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v5
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release -p mvm --target ${{ matrix.target }}
      - name: Build the .deb
        if: contains(matrix.target, 'linux')
        run: |
          cargo install cargo-deb --locked --version 3.8.0
          cargo deb -p mvm --target ${{ matrix.target }} --no-build --no-strip
          mkdir -p dist
          cp target/${{ matrix.target }}/debian/mvm_*.deb dist/
      - name: Run mvm --version
        if: matrix.run != 'skip'
        shell: bash
        run: |
          out="$(${{ matrix.run }} target/${{ matrix.target }}/release/mvm --version)"
          echo "$out"
          test "$out" = "mvm ${{ needs.meta.outputs.version }}"
      - name: Package
        shell: bash
        run: |
          name="mvm-${{ needs.meta.outputs.version }}-${{ matrix.target }}"
          mkdir -p dist "$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/mvm.exe "$name/"
            7z a "dist/$name.zip" "$name" > /dev/null
          else
            cp target/${{ matrix.target }}/release/mvm "$name/"
            tar czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mvm-${{ matrix.target }}
          path: dist/*

  firmware:
    needs: meta
    if: needs.meta.outputs.unit == 'firmware'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask firmware all
      - run: |
          mkdir -p dist
          cp target/firmware/amd64/mvm-nrf.uf2 dist/mvm-firmware-${{ needs.meta.outputs.version }}-nrf52840.uf2
          cp target/firmware/amd64/mvm-esp32s3.bin dist/mvm-firmware-${{ needs.meta.outputs.version }}-esp32s3.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*

  publish:
    needs: [meta, mvm, firmware]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        shell: bash
        run: |
          unit="${{ needs.meta.outputs.unit }}"
          version="${{ needs.meta.outputs.version }}"
          case "${{ needs.meta.outputs.unit }}" in
            firmware) tagline="MVM firmware for nRF52840 and ESP32-S3 boards, ready to flash" ;;
            applet-boot) tagline="The MVM bootstrapper applet" ;;
            mvm) tagline="The MVM command-line tool: build applets, run simulated meshes, and manage nodes (macOS, Linux, Windows). Building applets requires Docker." ;;
            sdk) tagline="The MVM applet SDK: a Docker image with the compilers, libraries, templates, and packer that mvm build runs. Pinned per applet by sdk in mvm.toml." ;;
            firmware-builder) tagline="Docker image that builds MVM kernel firmware. Only needed to build MVM from source; to flash a board, download a \`firmware\` release." ;;
          esac
          # The tagline in italics, then the section between this version's
          # heading and the next one.
          printf '*%s*\n' "$tagline" > notes.md
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' "changelog/$unit.md" >> notes.md
          # Install and Upgrade sections list only the package managers that
          # are switched on (repo variables PUBLISH_HOMEBREW, PUBLISH_APT, and
          # PUBLISH_WINGET; implementation plan 0.3b and 2.6f).
          if [[ "$unit" == mvm ]]; then
            upgrade=()
            {
              echo
              echo "### Install"
              if [[ "${{ vars.PUBLISH_HOMEBREW }}" == true ]]; then cat packaging/notes/homebrew.md; upgrade+=("brew upgrade mvm"); fi
              if [[ "${{ vars.PUBLISH_APT }}" == true ]]; then cat packaging/notes/apt.md; upgrade+=("sudo apt update && sudo apt install --only-upgrade mvm"); fi
              if [[ "${{ vars.PUBLISH_WINGET }}" == true ]]; then cat packaging/notes/winget.md; upgrade+=("winget upgrade mvm"); fi
              echo
              echo 'Or download an archive below and put `mvm` on your `PATH`.'
              if (( ${#upgrade[@]} )); then
                echo
                echo "### Upgrade"
                echo
                echo '```'
                printf '%s\n' "${upgrade[@]}"
                echo '```'
              fi
            } >> notes.md
          fi
          if [[ "$unit" == firmware ]]; then
            ver() { grep -m1 '^version = ' "$1" | cut -d'"' -f2; }
            builder="$(grep -m1 '^version = ' docker/firmware-builder/versions | cut -d' ' -f3)"
            {
              echo
              echo "### Components"
              echo
              echo "kernel $(ver crates/mvm-core/Cargo.toml) · boot none yet · firmware-builder $builder · ABI $(ver crates/mvm-abi/Cargo.toml)"
            } >> notes.md
          fi
          if [[ "$unit" == firmware-builder ]]; then
            {
              ref="$(grep '^image ' docker/firmware-builder/digest | cut -d' ' -f2)"
              echo
              echo "### Docker Hub"
              echo
              echo "Published on Docker Hub as [benallfree/mvm-firmware-builder:$version](https://hub.docker.com/r/benallfree/mvm-firmware-builder/tags), multi-arch (\`linux/arm64\` and \`linux/amd64\`). Pull it by digest:"
              echo
              echo '```'
              echo "docker pull $ref"
              echo '```'
              echo
              echo "### Pinned versions"
              echo
              echo '```'
              grep -v '^#' docker/firmware-builder/versions | grep -v '^$'
              echo '```'
            } >> notes.md
          fi
          cat notes.md
      - name: Checksums
        shell: bash
        run: |
          mkdir -p dist
          if compgen -G "dist/*" > /dev/null; then (cd dist && sha256sum * > SHA256SUMS); fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          flags=()
          if [[ "${{ needs.meta.outputs.prerelease }}" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "${{ needs.meta.outputs.unit }} ${{ needs.meta.outputs.version }}" \
            --notes-file notes.md "${flags[@]}"

  # Homebrew and apt (implementation plan 0.3b) and winget (2.6f), after the
  # release exists so their download URLs resolve. Each runs only while its
  # repo variable is true.
  packages:
    needs: [meta, publish]
    if: needs.meta.outputs.unit == 'mvm'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" -D dist
      - name: Homebrew tap
        if: vars.PUBLISH_HOMEBREW == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/benallfree/homebrew-mvm.git" tap
          mkdir -p tap/Formula
          packaging/homebrew/formula.sh "$VERSION" dist > tap/Formula/mvm.rb
          cd tap
          git config user.name "mvm release" && git config user.email "mvm-release@users.noreply.github.com"
          git add -A && git commit -m "mvm $VERSION" && git push
      - name: apt repository
        if: vars.PUBLISH_APT == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          git clone "https://x-access-token:${GH_TOKEN}@github.com/benallfree/mvm-apt.git" apt
          packaging/apt/publish.sh "$PWD/dist" "$PWD/apt"
          cd apt
          git config user.name "mvm release" && git config user.email "mvm-release@users.noreply.github.com"
          git add -A && git commit -m "mvm $VERSION" && git push
      - name: winget
        if: vars.PUBLISH_WINGET == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: packaging/winget/submit.sh "$VERSION" dist
