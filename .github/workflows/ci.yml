# CI (implementation plan 0.3).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add riscv32imafc-unknown-none-elf
      - run: cargo build --target thumbv7em-none-eabihf -p mvm-abi -p mvm-sdk -p mvm-mem -p mvm-code -p mvm-vm -p mvm-core -p mvm-hal
      - run: cargo build --target riscv32imafc-unknown-none-elf -p mvm-abi -p mvm-sdk

  mesh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p mesh
      - run: cargo test -p mesh

  firmware:
    runs-on: ubuntu-latest
    steps:
      # The ESP32-S3 image records the commit time, so build the branch's own
      # commit, not the pull request's merge commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask firmware all
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-amd64
          path: |
            target/firmware/amd64/*.uf2
            target/firmware/amd64/*.bin
