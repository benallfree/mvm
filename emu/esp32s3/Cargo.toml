[package]
name = "mvm-emu-esp32s3"
version = "0.1.0"
edition = "2021"

[dependencies]
bench-core = { path = "../bench-core" }
mvm-meshops-tests = { path = "../../meshops/tests" }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }
# esp-hal is pinned to 1.0.0: from 1.1 its ESP32-S3 PLL bring-up waits on a
# BBPLL calibration bit that Espressif's QEMU never sets (see emu/RESULTS.md).
esp-hal = { version = "=1.0.0", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.1", features = ["esp32s3", "embassy"] }
embassy-executor = "0.9"
embassy-time = "0.5"
embassy-sync = "0.7"
esp-println = { version = "0.16", default-features = false, features = ["esp32s3", "uart", "critical-section"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "off"
panic = "abort"
debug = "line-tables-only"
