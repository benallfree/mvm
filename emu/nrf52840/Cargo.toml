[package]
name = "mvm-emu-nrf52840"
version = "0.1.0"
edition = "2021"

[dependencies]
bench-core = { path = "../bench-core" }
mvm-meshops-tests = { path = "../../meshops/tests" }
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-time = "0.5"
embassy-sync = "0.8"
panic-halt = "1.0.0"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "off"
panic = "abort"
debug = "line-tables-only"
