[package]
name = "mvm-mem-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mvm-mem = { path = "../../crates/mvm-mem" }

# Its own workspace, so the root workspace's stable build never sees it.
[workspace]
members = ["."]

[[bin]]
name = "mem"
path = "fuzz_targets/mem.rs"
test = false
doc = false
bench = false
